<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.8/dist/htmx.min.js" integrity="sha384-/TgkGk7p307TH7EXJDuUlgG3Ce1UVolAOFopFekQkkXihi5u/6OCvVKyz1W+idaz" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Dashboard | Full Test App</title>
</head>
<body>
    <div>
        <div class="px-48 py-6 bg-slate-400 flex justify-between items-center">
            <h1 class="font-bold text-white text-2xl">Dashboard</h1>
            <button hx-post="/v1/auth/logout" class="bg-slate-600 px-4 py-1 rounded-lg text-white mt-2 hover:cursor-pointer">Logout</button>
        </div>
    
        <div class="px-4 py-4 flex gap-12">
            <div class="border border-gray-600 w-fit h-fit px-6 py-2 rounded-lg">
                <p class="font-bold">Data Profil Anda</p>
                <div id="userdata" 
                    hx-get="/v1/user/me" 
                    hx-trigger="load" >
                    <span class="text-gray-400 animate-pulse">Sedang mengambil data...</span>
                </div>
            </div>
            <div class="border border-gray-600 px-6 py-2 rounded-lg w-full">
                <p class="font-bold">Data Product Anda</p>
                <!-- Get Product Data here -->
                 <div id="productdata"
                    hx-get="/v1/product/all"
                    hx-trigger="load"
                 >
                    <span class="text-gray-400 animate-pulse">Sedang mengambil data...</span>
                 </div>
            </div>
        </div>
    </div>
</body>
</html>
