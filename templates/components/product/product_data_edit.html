{{ define "product_edit_component" }}
<tr class="border-b border-slate-700 bg-slate-700/30">
    <td class="p-3">
        {{ .ID }} 
        <input type="hidden" name="ID" value="{{ .ID }}">
    </td>
    
    <td class="p-3">
        <input type="text" name="product_name" value="{{ .ProductName }}"
               class="bg-slate-800 border border-slate-600 rounded px-2 py-1 w-full text-white">
    </td>
    
    <td class="p-3">
        <input type="number" name="price" value="{{ .Price }}" 
               class="bg-slate-800 border border-slate-600 rounded px-2 py-1 w-full text-white">
    </td>
    
    <td class="p-3 text-center flex gap-2 justify-center">
        <button hx-put="/v1/product/edit" 
                hx-target="closest tr" 
                hx-include="closest tr" 
                hx-swap="outerHTML"
                class="bg-green-600 px-3 py-1 rounded text-white">
            Simpan
        </button>
        
        <button hx-get="/v1/product/get/{{ .ID }}" 
                hx-target="closest tr" 
                hx-swap="outerHTML"
                class="bg-slate-600 px-3 py-1 rounded text-white">
            Batal
        </button>
    </td>
</tr>
{{ end }}
