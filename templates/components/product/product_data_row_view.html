{{ define "product_row_view" }}
<tr class="border-b border-slate-800 hover:bg-slate-700/50 transition-colors">
    <td class="p-3">#{{ .ID }}</td>
    <td class="p-3 font-semibold text-blue-400">{{ .ProductName }}</td>
    <td class="p-3 text-slate-400">{{ .FormatPrice }}</td>
    <td class="p-3 text-center">
        <button class="bg-yellow-500/20 text-white px-3 py-1 rounded-md border border-yellow-500/50 hover:bg-yellow-500 hover:text-white transition"
                hx-get="/v1/product/edit/component/{{ .ID }}"
                hx-target="closest tr"
                hx-swap="outerHTML">
            Edit
        </button>
        <button class="bg-red-500/20 text-white px-3 py-1 rounded-md border border-red-500/50 hover:bg-red-500 hover:text-white transition"
                hx-delete="/v1/product/delete/{{ .ID }}"
                hx-target="closest tr"
                hx-confirm="Hapus product ini?"
                hx-swap="outerHTML">
            Hapus
        </button>
    </td>
</tr>
{{ end }}
