<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.8/dist/htmx.min.js" integrity="sha384-/TgkGk7p307TH7EXJDuUlgG3Ce1UVolAOFopFekQkkXihi5u/6OCvVKyz1W+idaz" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Register | Full Test App</title>
</head>
<body>
    <div class="bg-slate-800 h-screen">
        <div class="flex justify-center items-center h-full">
            <div></div>
            <div class="flex flex-col gap-4">
                <form hx-post="/v1/auth/register" hx-target="#error-message">
                    <div class="flex flex-col w-fit">
                        <label for="email" class="text-white">Email</label>
                        <input id="email" name="email" type="text" placeholder="Email" class="bg-slate-400" required>
                    </div>
                    <div class="flex flex-col w-fit mt-4">
                        <label for="password" class="text-white">Password</label>
                        <input id="password" name="password" type="password" placeholder="Password" class="bg-slate-400" required>
                    </div>

                    <div id="error-message" class="text-red-400 text-sm text-center"></div>

                    <button type="submit" class="w-full bg-blue-800 text-white hover:cursor-pointer hover:bg-blue-900 rounded-lg py-1 mt-4">Register</button>
                </form>
                

                <div class="flex flex-col gap-2 justify-center items-center">
                    <p class="text-white">Sudah punya akun? </p>
                    <a href="/login" class="text-blue-400 underline w-fit">Login</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
